name: Deploy AFFL to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # =========================================================================
    # IN-SEASON SCHEDULE (September – January: Months 9, 10, 11, 12, 1)
    # =========================================================================
    # Tuesday Morning (13:15 UTC / ~9:15 AM EDT / 8:15 AM EST): Catches updated records soon after Sleeper finalizes Tuesday morning
    - cron: '15 13 * 9-12,1 2'
    # Tuesday Midday (17:15 UTC / ~1:15 PM EDT / 12:15 PM EST): Catches any delayed Tuesday morning finalizations
    - cron: '15 17 * 9-12,1 2'
    # Tuesday Evening (21:15 UTC / ~5:15 PM EDT / 4:15 PM EST): Catches afternoon record adjustments
    - cron: '15 21 * 9-12,1 2'
    # Wednesday Afternoon (17:15 UTC / ~1:15 PM EDT / 12:15 PM EST): Mid-week sync after waivers and early stat adjustments
    - cron: '15 17 * 9-12,1 3'
    # Thursday Morning (12:15 UTC / ~8:15 AM EDT / 7:15 AM EST): Runs after official Elias/NFL stat corrections finalize (at ~6:00 AM ET)
    - cron: '15 12 * 9-12,1 4'
    # Thursday Evening (23:15 UTC / ~7:15 PM EDT / 6:15 PM EST): Final pre-game sync before Thursday Night Football
    - cron: '15 23 * 9-12,1 4'

    # =========================================================================
    # OFF-SEASON SCHEDULE (February – August: Months 2–8)
    # =========================================================================
    # Weekly Tuesday Morning (13:15 UTC / ~9:15 AM EDT / 8:15 AM EST): Refreshes countdown banners, offseason trades & milestone states
    - cron: '15 13 * 2-8 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli "**/*.md" --ignore "_site/**" --ignore "node_modules/**" --ignore "vendor/**"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Lint Ruby Code (RuboCop)
        run: |
          gem install rubocop --no-document
          rubocop --format github --format progress _plugins/ _scripts/

      - name: Fetch Latest Sleeper Standings & Matchups
        run: |
          ruby _scripts/update_standings.rb

      - name: Setup GitHub Pages Config
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll Site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verify HTML & Internal Links (HTMLProofer)
        run: |
          gem install html-proofer -v "~> 5.0" --no-document
          ruby _scripts/proof_html.rb

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

title: The Art of Fantasy Football League (AFFL)
email: lance@parsonsclan.com
description: >-
  Official website for The Art of Fantasy Football League (AFFL) - 
  A competitive fantasy football league hosted on Sleeper.
baseurl: ""
url: ""
twitter_username: 
github_username: lparsons

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

# Custom variables
league_name: "The Art of Fantasy Football League"
league_abbreviation: "AFFL"
league_logo: "https://sleepercdn.com/avatars/3a3980fe203cf0de61241defe04aa2d0"
platform: "Sleeper"
current_season: 2026
current_league_id: "1257465132527661056"
current_draft_id: "1257465132527661057"

# Date Settings (Optional Overrides)
# Uncomment or set only if you need to override the automatic calculations:
keeper_deadline: "2026-08-23"          # Extended 2026 Keeper Deadline
draft_date: "2026-08-30 09:00:00"     # Format: "YYYY-MM-DD HH:MM:SS" (9:00 AM EDT)
# nfl_season_start: "2026-09-10"         # Format: "YYYY-MM-DD"

# Navigation
header_pages:
  - schedule.md
  - records.md
  - seasons.md
  - history.md
  - rules.md
  - about.md

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

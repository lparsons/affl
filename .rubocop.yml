AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - '_site/**/*'
    - '.sass-cache/**/*'
    - '.jekyll-cache/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'bin/**/*'

# Focus RuboCop on code safety, correctness, and bug prevention (Lint and Security)
# Disable stylistic and cosmetic departments (Layout, Style, Metrics, Naming) to eliminate bike-shedding
Layout:
  Enabled: false

Style:
  Enabled: false

Metrics:
  Enabled: false

Naming:
  Enabled: false

# On Windows/cross-platform checkouts, git does not track POSIX executable bits (+x)
Lint/ScriptPermission:
  Enabled: false

# Jekyll Page and Generator subclasses manage their own internal initialization
Lint/MissingSuper:
  Enabled: false

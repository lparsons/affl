AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  # Exclude external, generated, and third-party code
  Exclude:
    - '_site/**/*'
    - '.sass-cache/**/*'
    - '.jekyll-cache/**/*'
    - '.bundle/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'bin/**/*'
    - 'gemfiles/**/*'

# Enforce code layout & formatting with practical max line length for URLs and logs
Layout/LineLength:
  Max: 140
  AllowedPatterns:
    - '^#.*https?://'
    - 'https?://'
    - "warnings << '"
    - 'warnings << "'

# Disable arbitrary size & complexity thresholds on data-aggregation scripts
Metrics:
  Enabled: false

# Accommodate Windows cross-platform development (POSIX executable bit +x is not preserved)
Lint/ScriptPermission:
  Enabled: false

# Jekyll Page and Generator subclasses manage their own internal initialization
Lint/MissingSuper:
  Enabled: false

# Allow compact module/class definition (e.g., class Jekyll::LeagueCalendarGenerator)
Style/ClassAndModuleChildren:
  Enabled: false

# Internal static-site generator classes do not require public documentation
Style/Documentation:
  Enabled: false

# Allow readable block 'if' statements without forcing trailing modifier 'if' on long statements
Style/IfUnlessModifier:
  Enabled: false

# Allow large numeric identifiers (e.g. Sleeper 19-digit league IDs) without mandatory underscores
Style/NumericLiterals:
  Enabled: false

# Cross-platform checkout compatibility for Windows CRLF / LF line endings
Layout/EndOfLine:
  Enabled: false

# Sleeper API wrapper uses conventional get_* query method names
Naming/AccessorMethodName:
  Enabled: false



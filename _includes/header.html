<header class="site-header" role="banner">

  <div class="wrapper">
    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.header_pages | default: default_paths -%}
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      {% if site.league_logo %}
        <img src="{{ site.league_logo }}" alt="{{ site.title }}" style="height: 40px; vertical-align: middle; margin-right: 10px;">
      {% endif %}
      {{ site.title | escape }}
    </a>

    {%- if page_paths -%}
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
            </svg>
          </span>
        </label>

        <div class="trigger">
          <a class="page-link" href="{{ site.baseurl }}/schedule/">Schedule</a>
          <a class="page-link" href="{{ site.baseurl }}/records/">Record Book</a>
          <a class="page-link" href="{{ site.baseurl }}/seasons/">Seasons</a>
          <a class="page-link" href="{{ site.baseurl }}/history/">History</a>
          <a class="page-link" href="{{ site.baseurl }}/rules/">Rules</a>
          <a class="page-link" href="{{ site.baseurl }}/about/">About</a>
          
          <!-- Dark Mode Toggle -->
          <button id="theme-toggle" aria-label="Toggle Dark Mode" style="background: none; border: none; cursor: pointer; vertical-align: middle; padding: 0 10px;">
            <span id="theme-toggle-icon">🌙</span>
          </button>
        </div>
      </nav>
    {%- endif -%}
  </div>
</header>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const themeToggleIcon = document.getElementById('theme-toggle-icon');
  const body = document.body;

  // Default is now DARK. Check if user has explicitly chosen LIGHT.
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    body.classList.add('light-mode');
    themeToggleIcon.textContent = '🌙';
  } else {
    themeToggleIcon.textContent = '☀️';
  }

  themeToggle.addEventListener('click', () => {
    body.classList.toggle('light-mode');
    const isLight = body.classList.contains('light-mode');
    themeToggleIcon.textContent = isLight ? '🌙' : '☀️';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });
</script>

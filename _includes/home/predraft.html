<div class="dashboard-grid">
  <!-- Draft Countdown -->
  <div class="dashboard-card" style="grid-column: span 2;">
    <h2>⏳ Draft Countdown</h2>
    <div style="display: flex; align-items: center; justify-content: space-around; padding: 20px 0;">
      <div style="text-align: center;">
        <p style="font-size: 2em; font-weight: bold; margin: 0;" id="days-remaining">--</p>
        <p style="margin: 0; opacity: 0.8;">Days</p>
      </div>
      <div style="text-align: center;">
        <p style="font-size: 1.2em; margin: 0;">{{ site.draft_date | date: "%B %d, %Y" }}</p>
        <p style="margin: 0; opacity: 0.8;">at {{ site.draft_date | date: "%I:%M %p" }}</p>
      </div>
      <a href="https://sleeper.com/leagues/{{ site.current_league_id }}/draft" target="_blank" class="btn" style="margin: 0;">Enter Draft Room</a>
    </div>
  </div>

  <!-- Draft Prep Links -->
  <div class="dashboard-card">
    <h2>📋 Prep Tools</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="https://sleeper.com/leagues/{{ site.current_league_id }}" target="_blank" class="btn">View Sleeper League</a>
      <a href="{{ site.baseurl }}/rules/" class="btn">Review Rules</a>
      <a href="{{ site.baseurl }}/history/" class="btn">Past Records</a>
    </div>
  </div>
</div>

<script>
  (function() {
    const draftDate = new Date("{{ site.draft_date }}").getTime();
    const now = new Date().getTime();
    const diff = draftDate - now;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById('days-remaining').textContent = days > 0 ? days : 0;
  })();
</script>

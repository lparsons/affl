name: Deploy AFFL to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Run automatically every Tuesday at 10:00 AM UTC (after Monday Night Football) to sync Sleeper stats
    - cron: '0 10 * * 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli "**/*.md" --ignore "_site/**" --ignore "node_modules/**" --ignore "vendor/**"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Lint Ruby Code (RuboCop)
        run: |
          gem install rubocop --no-document
          rubocop _plugins/ _scripts/

      - name: Fetch Latest Sleeper Standings & Matchups
        run: |
          ruby _scripts/update_standings.rb

      - name: Setup GitHub Pages Config
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll Site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verify HTML & Internal Links (HTMLProofer)
        run: |
          gem install html-proofer -v "~> 5.0" --no-document
          ruby _scripts/proof_html.rb

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
